name: Restore HELIXEDU source tree
on:
  push:
    branches:
      - repair/restore-source-tree
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/restore-source-tree
      - name: Restore original project structure
        run: |
          set -euo pipefail
          test -f helixedu-ai-education-platform.zip
          find . -maxdepth 1 -type f ! -name README.md ! -name .gitignore -delete
          unzip -o helixedu-ai-education-platform.zip -d .
          rm -f helixedu-ai-education-platform.zip
      - name: Commit restored source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore HELIXEDU project source structure"
            git push origin HEAD:repair/restore-source-tree
          fi
